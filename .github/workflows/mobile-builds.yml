name: SWK OS Mobile Builds (Android APK/AAB + iOS Xcode)

on:
  push:
    branches: [main, 'feat/**', 'release/**']
    paths:
      - 'src/web/**'
      - 'src/shared/**'
      - 'mobile/**'
      - 'public/**'
      - 'package.json'
      - '.github/workflows/mobile-builds.yml'
  pull_request:
    paths:
      - 'src/web/**'
      - 'src/shared/**'
      - 'mobile/**'
      - 'public/**'
      - 'package.json'
      - '.github/workflows/mobile-builds.yml'
  workflow_dispatch:
    inputs:
      api_base:
        description: 'HTTPS API base URL embedded into mobile/www/swk-runtime-config.js'
        required: false
        default: 'https://os.swk.properties'

jobs:
  web-and-mobile-sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: node mobile/scripts/gen-nsc.mjs
      - name: Sync dist/web into mobile/www with runtime config
        env:
          SWK_API_BASE: ${{ inputs.api_base || 'https://os.swk.properties' }}
        run: |
          node mobile/scripts/sync-web.mjs
          grep -q '/swk-runtime-config.js' mobile/www/index.html
          grep -q 'API_BASE' mobile/www/swk-runtime-config.js

  android-apk-aab:
    needs: web-and-mobile-sync
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Ensure Android SDK 35 & Build Tools 35.0.0
        run: |
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          SDKMANAGER="$SDK/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$SDK/cmdline-tools" -name sdkmanager -type f 2>/dev/null | head -n 1 || true)"
          fi
          if [ -n "$SDKMANAGER" ] && [ -x "$SDKMANAGER" ]; then
            yes | "$SDKMANAGER" --licenses >/dev/null || true
            "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0" "platform-tools"
          else
            echo "Using preinstalled Android SDK at $SDK"
          fi

      - run: npm ci
      - run: npm run build:web

      - name: Install mobile Capacitor dependencies
        working-directory: mobile
        run: |
          if [ -f package-lock.json ]; then
            npm ci --no-audit --no-fund
          else
            npm install --no-audit --no-fund
          fi

      - name: Prepare optional signing keystore & google-services.json
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "${RUNNER_TEMP}/swk-release.jks"
            echo "SWK_KEYSTORE_FILE=${RUNNER_TEMP}/swk-release.jks" >> "$GITHUB_ENV"
            echo "SWK_KEYSTORE_PASSWORD=${ANDROID_KEYSTORE_PASSWORD}" >> "$GITHUB_ENV"
            echo "SWK_KEY_ALIAS=${ANDROID_KEY_ALIAS}" >> "$GITHUB_ENV"
            echo "SWK_KEY_PASSWORD=${ANDROID_KEY_PASSWORD}" >> "$GITHUB_ENV"
          fi
          if [ -n "$GOOGLE_SERVICES_JSON_BASE64" ]; then
            echo "$GOOGLE_SERVICES_JSON_BASE64" | base64 --decode > mobile/android/app/google-services.json
          fi

      - name: Generate NSC, sync web & Capacitor Android
        working-directory: mobile
        env:
          SWK_API_BASE: ${{ inputs.api_base || 'https://os.swk.properties' }}
        run: |
          node scripts/gen-nsc.mjs
          node scripts/sync-web.mjs
          npx cap sync android

      - name: Build Android Debug APK, Release APK & Play Release AAB
        working-directory: mobile/android
        run: |
          sed -i 's/\r$//' gradlew
          chmod +x gradlew
          ./gradlew assembleDebug assembleRelease bundleRelease --no-daemon

      - name: Stage clearly named installable APK artifact
        run: |
          mkdir -p dist-android/unsigned-play-release
          if [ -n "${SWK_KEYSTORE_FILE:-}" ] && [ -f mobile/android/app/build/outputs/apk/release/app-release.apk ]; then
            cp mobile/android/app/build/outputs/apk/release/app-release.apk dist-android/SWK-OS-Android-INSTALL.apk
            cp mobile/android/app/build/outputs/bundle/release/app-release.aab dist-android/SWK-OS-PlayStore.aab
          else
            cp mobile/android/app/build/outputs/apk/debug/app-debug.apk dist-android/SWK-OS-Android-INSTALL.apk
            cp mobile/android/app/build/outputs/apk/release/app-release-unsigned.apk dist-android/unsigned-play-release/ 2>/dev/null || true
            cp mobile/android/app/build/outputs/bundle/release/app-release.aab dist-android/unsigned-play-release/ 2>/dev/null || true
          fi
          ls -lh dist-android dist-android/unsigned-play-release

      - uses: actions/upload-artifact@v4
        with:
          name: swk-os-android-apk-aab
          path: dist-android/**
          retention-days: 14

  ios-xcode-build:
    needs: web-and-mobile-sync
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run build:web

      - name: Install mobile Capacitor dependencies
        working-directory: mobile
        run: |
          if [ -f package-lock.json ]; then
            npm ci --no-audit --no-fund
          else
            npm install --no-audit --no-fund
          fi

      - name: Sync web & Capacitor iOS
        working-directory: mobile
        env:
          SWK_API_BASE: ${{ inputs.api_base || 'https://os.swk.properties' }}
        run: |
          node scripts/sync-web.mjs
          npx cap sync ios

      - name: Install CocoaPods & build unsigned iOS Release binary
        working-directory: mobile/ios/App
        run: |
          pod install
          xcodebuild \
            -workspace App.xcworkspace \
            -scheme App \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build
